name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # Native arm64. HaLOS is an arm64 distribution and the marine app is this
    # image's only consumer, so there is no amd64 target to serve -- and the
    # expensive build step is an npm install, which QEMU would emulate.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Everything versionable lives in build.env. The tag's version half is read
      # from the base image's own installed signalk-server rather than parsed out
      # of BASE, so upstream's tag naming is never our problem.
      - name: Resolve the published tag
        id: tag
        run: |
          set -euo pipefail
          . ./build.env
          docker pull -q "$BASE"
          upstream="$(docker run --rm --entrypoint node "$BASE" \
            -p "require('/home/node/signalk/node_modules/signalk-server/package.json').version")"
          echo "base=$BASE"           >> "$GITHUB_OUTPUT"
          echo "tag=${upstream}-${BUILD}" >> "$GITHUB_OUTPUT"
          echo "Base:      $BASE"
          echo "Publishes: ${upstream}-${BUILD}"

      # Nothing is pinned (matching upstream, whose own image resolves its bundled
      # plugins fresh), so two builds of one commit can differ. Tags must therefore
      # never be reused: the marine app pins by name, and republishing would swap
      # content underneath a tag that a previous verification gated.
      - name: Refuse to overwrite a published tag
        if: github.event_name == 'push'
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if docker manifest inspect "${REGISTRY}/${IMAGE_NAME}:${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} is already published. Increment BUILD in build.env." >&2
            exit 1
          fi
          echo "Tag ${tag} is unpublished; proceeding."

      - uses: docker/setup-buildx-action@v4

      # Build into the local daemon first, so verification runs against the exact
      # image that would be pushed, before anything reaches the registry.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: BASE=${{ steps.tag.outputs.base }}
          load: true
          push: false
          tags: candidate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install bcrypt for the verification harness
        run: python3 -m pip install --quiet --break-system-packages bcrypt

      - name: Verify the image loads every curated package
        run: tests/verify-image.sh candidate:${{ github.sha }} plugins.list

      - name: Record resolved plugin versions
        run: ./run plugin-versions candidate:${{ github.sha }} | tee "$GITHUB_STEP_SUMMARY"

      # No registry credential exists on the pull-request path, so build-time code
      # from an untrusted branch cannot reach the registry.
      - name: Log in to the container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: BASE=${{ steps.tag.outputs.base }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
