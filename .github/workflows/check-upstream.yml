name: Check upstream base image

# BASE is the only thing here that goes stale on its own, and nothing else
# watches it: the marine app pins our image, so its update checker follows our
# GHCR tags and never looks at upstream's.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: check-base-update
  cancel-in-progress: true

env:
  BRANCH: chore/update-base-image

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read         # the bump branch is pushed with BUMP_PAT, not this

    steps:
      # A PR opened with GITHUB_TOKEN raises no pull_request event, so build.yml
      # would never attach a check to it. Everything below therefore runs as
      # BUMP_PAT -- both the push, via checkout's persisted credentials, and the
      # gh calls. Refusing to start without it is deliberate: falling back to
      # GITHUB_TOKEN would still open a PR, just an unverified one, and an
      # expired token would degrade to that silently.
      - name: Require the bump credential
        env:
          BUMP_PAT: ${{ secrets.BUMP_PAT }}
        run: |
          [ -n "$BUMP_PAT" ] || {
            echo "::error::BUMP_PAT is unset. It opens the bump PR so build.yml runs on it as a check; without it the PR would carry none." >&2
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.BUMP_PAT }}

      # The detection lives in a script rather than in ./run because `run` is in
      # build.yml's paths filter: a command added there would put every merge
      # that touches it on the publish path, where it resolves an already
      # published tag and reddens main.
      - name: Look for a newer base image
        id: check
        run: .github/scripts/check-base-update.sh

      - name: Open or refresh the bump PR
        if: steps.check.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUMP_PAT }}
          NEW_BASE: ${{ steps.check.outputs.new_base }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"

          # Re-pushing an unchanged bump every morning would restart its check,
          # so the branch is only touched when it does not already carry this
          # exact build.env -- and only while a PR is open, so a run that died
          # before opening one still recovers.
          if [ -n "$existing" ] && git fetch --quiet origin "$BRANCH" 2>/dev/null &&
             git show FETCH_HEAD:build.env | diff -q - build.env >/dev/null 2>&1; then
            echo "PR #${existing} already carries this bump."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add build.env
          git commit -m "chore: bump base image to ${NEW_BASE#*:}"
          git push --force origin "$BRANCH"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file /tmp/pr_body.md
            echo "Updated #${existing}"
          else
            gh pr create \
              --title "chore: bump base image to ${NEW_BASE#*:}" \
              --body-file /tmp/pr_body.md
          fi
