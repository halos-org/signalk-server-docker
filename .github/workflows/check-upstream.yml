name: Check upstream base image

# BASE is the only thing here that goes stale on its own, and nothing else
# watches it: the marine app pins our image, so its update checker follows our
# GHCR tags and never looks at upstream's.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: check-base-update
  cancel-in-progress: true

env:
  BRANCH: chore/update-base-image
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read         # the bump branch is pushed with BUMP_PAT, not this

    steps:
      # Checkout persists this token, so the later git push runs as BUMP_PAT too
      # -- which is why no separate push credential appears below. Failing here
      # rather than falling back to GITHUB_TOKEN is argued in AGENTS.md.
      #
      # Presence, not validity: an expired or revoked token is still a non-empty
      # string and fails at checkout instead. This catches the secret being
      # deleted or never provisioned, which would otherwise clone anonymously
      # from this public repo and stay green until an upstream release finally
      # exercised the gh calls.
      - name: Require the bump credential
        env:
          BUMP_PAT: ${{ secrets.BUMP_PAT }}
        run: |
          [ -n "$BUMP_PAT" ] || {
            echo "::error::BUMP_PAT is unset. It opens the bump PR so build.yml runs on it as a check; without it the PR would carry none." >&2
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.BUMP_PAT }}

      # The detection lives in a script rather than in ./run because `run` is in
      # build.yml's paths filter: a command added there would put every merge
      # that touches it on the publish path, where it resolves an already
      # published tag and reddens main.
      - name: Look for a newer base image
        id: check
        run: .github/scripts/check-base-update.sh

      - name: Open or refresh the bump PR
        if: steps.check.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUMP_PAT }}
          NEW_BASE: ${{ steps.check.outputs.new_base }}
        run: |
          set -euo pipefail

          # checkout takes the dispatched ref, and the steps below rename that
          # ref's tip to $BRANCH and force-push it. Dispatched from a feature
          # branch that would publish the whole branch as a bump PR -- and now
          # auto-merge it. Only the default branch may drive this.
          [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] || {
            echo "::error::refusing to touch ${BRANCH} from ${GITHUB_REF_NAME}; this step only runs on ${DEFAULT_BRANCH}." >&2
            exit 1
          }

          # Auto-merge only waits for something if a required check exists. With
          # no ruleset the PR is mergeable the moment it opens, and gh merges it
          # outright rather than arming it -- publishing a bump nothing built.
          # The ruleset is repo settings, invisible to this repo, so assert it
          # rather than assume it.
          gh api "repos/${GITHUB_REPOSITORY}/rulesets" --jq '.[].id' \
            | while read -r id; do
                gh api "repos/${GITHUB_REPOSITORY}/rulesets/${id}"
              done \
            | jq -e -s 'any(.[];
                  .enforcement == "active"
                  and (.conditions.ref_name.include // [] | index("~DEFAULT_BRANCH"))
                  and (.rules[] | select(.type == "required_status_checks")
                       | .parameters.required_status_checks[]? | .context == "build"))' >/dev/null || {
            echo "::error::No active ruleset requires the build check on the default branch. Auto-merge would land the bump unbuilt; refusing to arm." >&2
            exit 1
          }

          # Arming is per-PR state that can fail on its own, and gh's exit status
          # does not distinguish the failures from the no-ops. Only the flag
          # being absent afterwards is evidence. The head SHA is pinned because
          # gh drops --auto and merges outright when GitHub already considers the
          # PR mergeable; without it that merge would take whatever the head is
          # at that instant rather than the commit this run built.
          enable_auto_merge() {
            local pr="$1" head="$2" state err
            for _ in 1 2 3; do
              err="$(gh pr merge "$pr" --auto --merge --match-head-commit "$head" 2>&1 >/dev/null)" || true
              state="$(gh pr view "$pr" --json state,autoMergeRequest \
                       --jq 'if .autoMergeRequest then "armed"
                             elif .state == "MERGED" then "merged"
                             elif .state == "CLOSED" then "closed"
                             else "" end')" || state=""
              case "$state" in
                armed|merged) echo "PR #${pr}: ${state}."; return 0 ;;
                closed) echo "::error::PR #${pr} is closed; nothing to arm." >&2; return 1 ;;
              esac
              sleep 5
            done
            echo "::error::Could not arm auto-merge on #${pr}; the bump will sit unmerged. Last error: ${err}" >&2
            return 1
          }

          # --head matches a ref NAME across every fork, so on a public repo an
          # open fork PR branched as $BRANCH would be selected here -- and then
          # edited and auto-merged with our credential. Only a PR whose head is
          # this repo counts.
          existing="$(gh pr list --head "$BRANCH" --state open \
                        --json number,isCrossRepository \
                        --jq '[.[] | select(.isCrossRepository == false)] | .[0].number // empty')"

          # Re-pushing an unchanged bump every morning would restart its check,
          # so the branch is only touched when it does not already carry this
          # exact build.env -- and only while a PR is open, so a run that died
          # before opening one still recovers. Auto-merge is still re-asserted:
          # the bump being carried is not the same as it being armed to land.
          if [ -n "$existing" ] && git fetch --quiet origin "$BRANCH" 2>/dev/null &&
             git show FETCH_HEAD:build.env | diff -q - build.env >/dev/null 2>&1; then
            echo "PR #${existing} already carries this bump."
            enable_auto_merge "$existing" "$(git rev-parse FETCH_HEAD)"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add build.env
          git commit -m "chore: bump base image to ${NEW_BASE#*:}"
          git push --force origin "$BRANCH"
          head="$(git rev-parse HEAD)"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file /tmp/pr_body.md
            pr="$existing"
            echo "Updated #${pr}"
          else
            gh pr create \
              --title "chore: bump base image to ${NEW_BASE#*:}" \
              --body-file /tmp/pr_body.md >/dev/null
            # Same query as above rather than scraping gh's stdout, which is a
            # display format with no stability promise.
            pr="$(gh pr list --head "$BRANCH" --state open \
                    --json number,isCrossRepository \
                    --jq '[.[] | select(.isCrossRepository == false)] | .[0].number // empty')"
            echo "Opened #${pr}"
          fi

          enable_auto_merge "$pr" "$head"
